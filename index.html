<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Form | Validated</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="card" aria-labelledby="formTitle">

      <header class="card-header">
        <p class="eyebrow">Get in touch</p>
        <h1 id="formTitle">Contact or apply</h1>
        <p class="intro">Fill in the form below and I will reply within two working days.</p>
      </header>

      <form id="contactForm" class="form" novalidate>

        <div class="field" data-field="name">
          <label for="name">Full name <span class="req" aria-hidden="true">*</span></label>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Ritik Sharma" aria-describedby="name-error" required>
          <p class="error" id="name-error" aria-live="polite"></p>
        </div>

        <div class="field" data-field="email">
          <label for="email">Email <span class="req" aria-hidden="true">*</span></label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" aria-describedby="email-error" required>
          <p class="error" id="email-error" aria-live="polite"></p>
        </div>

        <div class="field" data-field="phone">
          <label for="phone">Phone <span class="optional">(optional)</span></label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+91 98765 43210" aria-describedby="phone-error">
          <p class="error" id="phone-error" aria-live="polite"></p>
        </div>

        <div class="field" data-field="message">
          <label for="message">Message <span class="req" aria-hidden="true">*</span></label>
          <textarea id="message" name="message" rows="5" placeholder="Tell me about your project or role" aria-describedby="message-error message-count" required></textarea>
          <div class="field-footer">
            <p class="error" id="message-error" aria-live="polite"></p>
            <span class="count" id="message-count">0 / 500</span>
          </div>
        </div>

        <button type="submit" class="submit-btn">
          <span class="btn-label">Send message</span>
          <span class="btn-loader" aria-hidden="true"></span>
        </button>

        <p class="status" id="formStatus" role="status" aria-live="polite"></p>
      </form>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
